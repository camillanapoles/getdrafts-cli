name: CI

on:
  push:
    branches: [main, "arena/**", "reverse/**"]
  pull_request:

permissions:
  contents: write

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The dev sandbox has no Go toolchain, so go.sum cannot be regenerated
      # locally. CI is the only place that can.
      # This step only commits on a real branch push: on pull_request runs
      # github.ref_name is the merge ref, and pushing to it is invalid.
      - name: Tidy modules
        run: go mod tidy
      - name: Commit go.sum if changed
        if: github.event_name == 'push'
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "CI"
          git add go.mod go.sum
          if git diff --cached --quiet; then
            echo "go.sum unchanged"
            exit 0
          fi
          git commit -m "chore: update go.sum (go mod tidy)"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" || echo "push skipped (branch protected)"

      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        id: test
        # `shell: bash` gives us `-o pipefail`, so a failing `go test`
        # is never masked by `tee`.
        shell: bash
        run: go test ./... 2>&1 | tee /tmp/test.log
      - name: Upload test log on failure
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.log
          if-no-files-found: ignore
      - name: Race (core)
        run: go test -race ./core/...

  # Best-effort: the Android toolchain (SDK + NDK + gomobile) is not needed
  # to ship the Go core. Every step is continue-on-error so a missing
  # toolchain surfaces in the log without blocking merges.
  android:
    name: Android build (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile gomobile boundary (plain Go)
        run: go build ./android/core-go/

      - uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        with:
          gradle-version: '8.7'
      - name: Build APK
        continue-on-error: true
        run: cd android && gradle assembleDebug --no-daemon
