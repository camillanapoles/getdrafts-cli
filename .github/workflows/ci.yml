name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race (core)
        run: go test -race ./core/...

  android:
    name: Android build (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Bind Go core (gomobile)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          bash android/core-go/build-core.sh
      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon
