name: TMP api probe
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

jobs:
  api:
    name: dump gomobile API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          gomobile init
      - name: Bind
        run: |
          mkdir -p /tmp/out
          gomobile bind -target=android -androidapi 24 -o /tmp/out/drafto.aar ./android/core-go
      - name: Save listing for artifact
        run: echo ok
      - name: Dump signatures as annotations
        shell: bash
        run: |
          set -x
          cd /tmp/out
          unzip -o -q drafto.aar classes.jar -d x
          ls -la x/
          cd x
          unzip -o -q classes.jar -d cls
          find cls -name "*.class" | head -30
          echo "--- count: $(find cls -name '*.class' | wc -l)"
          # javap on the extracted dir (no jar needed)
          : > /tmp/sig.txt
          for f in $(find cls -name "*.class" | grep -v '\$' | sed 's|cls/||;s|\.class$||' | tr '/' '.'); do
            case "$f" in go.drafto.*) echo "##### $f" >> /tmp/sig.txt; javap -classpath cls "$f" >> /tmp/sig.txt 2>&1 ;; esac
          done
          echo "--- sig lines: $(wc -l < /tmp/sig.txt)"
          find cls -name "*.class" | sed 's|cls/||' > /tmp/classes.txt
          sort -u /tmp/classes.txt | head -40
          echo "=== TOP-LEVEL PACKAGES ==="
          awk -F/ '{print $1"/"$2}' /tmp/classes.txt | sort -u
          cat /tmp/sig.txt
          i=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::error title=SIG[$i]::$line"
            i=$((i+1))
            [ $i -ge 190 ] && break
          done < /tmp/sig.txt
          exit 0
      - name: Upload class listing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aar-classes
          path: |
            /tmp/classes.txt
            /tmp/sig.txt
          if-no-files-found: warn
